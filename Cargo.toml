# Every member is `publish = false` on purpose: this is an application, not a library anyone depends
# on, and nothing here is stable enough to carry an immutable registry version. A name held there
# under this project is a `0.0.0` placeholder with no code in it, which is why holding one does not
# contradict this line.
[workspace]
resolver = "2"
members = [
    "crates/channel",
    "crates/krun",
    "crates/supervisor",
    "crates/guest-agent",
    "crates/cli",
    "crates/test-support",
    "xtask",
]
# `fuzz` is the `cargo fuzz` harness: nightly + libFuzzer, its own detached workspace, never part of
# the everyday stable gate. Excluded here too so `cargo build --workspace` ignores it.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.4"
edition = "2024"
# The minimum supported Rust version: the downstream MSRV floor. Kept in step with the exact
# toolchain pinned in `rust-toolchain.toml`, so local, CI, and this floor are one Rust version and a
# lint can't pass locally yet fail CI. The project tracks current stable with deliberate bumps (no
# back-support burden this early), never incidental drift; a support window is revisited at v0.1.0.
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Kendrick Lawton"]
repository = "https://github.com/kendricklawton/behavioral-sandbox"

# Dependency-light by design. The host path is `unsafe`-free and the CLI parses with clap.
[workspace.dependencies]
anyhow = "1"
# `wrap_help` costs one crate (`terminal_size`) and is what makes `--help` legible: without it clap
# wraps at no width at all, so a flag whose doc comment runs long prints off the right edge of any
# terminal. That is not hypothetical here, since a `///` on a clap field *is* the user interface,
# and the CLI's `-h` ran 19 lines past 80 columns before this was set.
clap = { version = "4", features = ["derive", "wrap_help"] }
# Scrubs a secret from memory after `bsx-channel` sends it, so it doesn't linger in freed memory.
zeroize = "1"
# Safe wrappers over the pty, termios and signal syscalls the interactive shell path needs on both
# ends; already in the graph through clap's `terminal_size`. Each crate names only the features it
# uses. The crate's internal `unsafe` is the dep's, not ours.
rustix = { version = "1", default-features = false, features = ["std"] }
# Structured logging to stderr; stdout stays reserved for a run's result.
tracing = "0.1"
# The window a sandbox's `--display` is shown in, and the CPU-side blit that puts a frame on it.
# Both open their display server at run time (`*-dlopen`), so a host without one still builds and
# runs everything but the window. No host-side GPU is involved: the guest's frames arrive in RAM.
# `wayland-csd-adwaita-notitle` draws window decorations without pulling in a font stack.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# `json`: the `--log-json` machine-readable encoding of the same structured events.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# No-panic discipline on the host path: a hostile or crashing guest, a failed probe, or a broken
# channel is a typed `Err`, never a crash. `unwrap`/`expect` are denied outside tests; `clippy.toml`
# re-allows them in tests. Enforced by the `clippy … -D warnings` step in CI and `cargo xtask ci`.
# Each crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# Design rule 5 (no panic on the host path) is the rule the code is written against, so the compiler
# enforces it rather than habit: the explicit-panic macros are denied tree-wide. Unlike
# `unwrap`/`expect`, clippy has no "allow in tests" knob for these, so the integration-test crates
# that use `panic!` as an assertion helper opt out with a file-level `#![allow(clippy::panic)]`.
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
