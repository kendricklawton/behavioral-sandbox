# Every member is `publish = false` on purpose: the engine is not distributed through crates.io.
# The support window is computed from Firecracker's and ends; an immutable registry version would
# outlive it, looking usable on an unpatched VMM. A name held there under this project is a `0.0.0`
# placeholder with no code in it, which is why holding one does not contradict this line. Reasoning:
# docs/embedding-scope.md.
[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/channel",
    "crates/guest-agent",
    "crates/probes-common",
    "crates/probes-loader",
    "crates/record",
    "crates/protocol",
    "crates/client",
    "crates/cli",
    "crates/test-support",
    "xtask",
]
# `crates/probes` holds the eBPF programs. They build for `bpfel-unknown-none` (not the host
# triple) via `bpf-linker`, so excluding them keeps the everyday host gate (clippy --all-targets,
# test) host-only and green; the eBPF object is built separately for its own target. See
# `AGENTS.md`.
# `fuzz` is the `cargo fuzz` harness: nightly + libFuzzer, its own detached workspace, never part of
# the everyday stable gate. Excluded here too so `cargo build --workspace` ignores it.
exclude = ["crates/probes", "fuzz"]

[workspace.package]
version = "0.0.2"
edition = "2021"
# The minimum supported Rust version: the downstream MSRV floor. Kept in step with the exact
# toolchain pinned in `rust-toolchain.toml`, so local, CI, and this floor are one Rust version and a
# lint can't pass locally yet fail CI. The project tracks current stable with deliberate bumps (no
# back-support burden this early), never incidental drift; a support window is revisited at v0.1.0.
rust-version = "1.97"
license = "Apache-2.0"
authors = ["eKVM Contributors"]
repository = "https://github.com/ekvm-rs/ekvm"

# Dependency-light by design. The host/driver path is `unsafe`-free; the Firecracker API is JSON
# over a unix socket (serde), the CLI parses with clap, logs with tracing.
[workspace.dependencies]
anyhow = "1"
# `wrap_help` costs one crate (`terminal_size`) and is what makes `--help` legible: without it clap
# wraps at no width at all, so a flag whose doc comment runs long prints off the right edge of any
# terminal. That is not hypothetical here, since a `///` on a clap field *is* the user interface,
# and `ekvm run -h` ran 19 lines past 80 columns before this was set.
clap = { version = "4", features = ["derive", "wrap_help"] }
# The CLI's live view (`ekvm run --watch`), rendered to **stderr** so stdout stays pipe-clean.
# Terminal I/O rides ratatui's re-exported crossterm, so the two can't version-skew.
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The CLI's `.ekvm.toml` config file layer. Parse-only; keys mirror the `EKVM_*` env names.
toml = "1"
# Record integrity: an `ed25519` detached signature over the canonical record bytes,
# so a consumer detects post-hoc alteration off-host. The audited, standard implementation, never a
# hand-rolled one; keygen randomness is read from `/dev/urandom` (Linux-only engine), so no `rand`.
# `zeroize` scrubs the secret key from memory on drop.
ed25519-dalek = { version = "3", features = ["zeroize"] }
# Scrub transient copies of the signing seed (the hex read from / written to the key file) so the
# secret doesn't linger in freed memory.
zeroize = "1"
# SHA-256 for the record hash-chain: each record commits to the previous one's hash.
# Already pulled in transitively by `ed25519-dalek`; pinned here so the loader names it directly.
sha2 = "0.11"
# Structured logging to stderr; stdout stays reserved for a run's result / audit log.
tracing = "0.1"
# `json`: the daemon's `--log-json` machine-readable encoding of the same structured events.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Statistical micro-benchmarking framework for in-memory operations (record signing, JSON, wire types).
criterion = { version = "0.5", features = ["html_reports"] }

# No-panic discipline on the host path: a hostile or crashing guest, a failed probe, or a broken
# channel is a typed `Err`, never a crash. `unwrap`/`expect` are denied outside tests; `clippy.toml`
# re-allows them in tests. Enforced by the `clippy … -D warnings` step in CI and `cargo xtask ci`.
# Each crate opts in with `[lints] workspace = true`.
# The `ed25519`/`sha2` record-signing path. is heavy in an unoptimized build, curve
# arithmetic runs 10-40x slower, which makes debug tests crawl and `bench-sign` in a dev build report
# meaningless numbers. Optimize just those crates even in the dev profile (the dalek crates' own
# recommendation); it leaves everything else debuggable. The definitive `bench-sign` number is still
# a `--release` run.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# Design rule 5 (no panic on the host path) is the rule the code is written against, so the compiler
# enforces it rather than habit: the explicit-panic macros are denied tree-wide. Unlike
# `unwrap`/`expect`, clippy has no "allow in tests" knob for these, so the integration-test crates
# that use `panic!` as an assertion helper opt out with a file-level `#![allow(clippy::panic)]`.
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
