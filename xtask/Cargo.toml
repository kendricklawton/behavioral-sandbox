[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Dev orchestration (the cargo-xtask pattern). `cargo xtask ci` is the host-safe gate; never shipped.
[dependencies]
anyhow.workspace = true
clap.workspace = true
# The host↔guest contract constants (`VSOCK_PORT`, `GUEST_READY_MARKER`): the rootfs build
# writes the guest's init line from the same definition the driver dials, so they cannot drift.
bsx-channel = { path = "../crates/channel" }
# The driver, for `bench-boot`: it boots real microVMs and reads `boot_latency`. A dev-only
# dep on a never-shipped crate; the everyday `ci` gate doesn't invoke it (booting needs KVM).
bsx-engine = { path = "../crates/engine" }
# The host-identity parse (`HostIds`), for the privileged gate's root check: one `Uid:` parse for
# the workspace's tooling instead of a third hand copy beside record's and the engine's.
bsx-record = { path = "../crates/record" }
# The probe loader, for `bench-trace`: it attaches the syscall tracepoints and measures their
# per-syscall overhead. Dev-only; the everyday `ci` gate doesn't invoke it (loading eBPF
# needs CAP_BPF/CAP_PERFMON).
bsx-probes-loader = { path = "../crates/probes-loader" }

[dev-dependencies]
# The shared scratch-dir guard for the tests, instead of a hand-rolled TempDir per test module.
bsx-test-support = { path = "../crates/test-support" }

[lints]
workspace = true
