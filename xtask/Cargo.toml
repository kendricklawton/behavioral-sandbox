[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Dev orchestration (the cargo-xtask pattern). `cargo xtask ci` is the host-safe gate; never shipped.
[dependencies]
anyhow.workspace = true
clap.workspace = true
# The host↔guest contract constants (`VSOCK_PORT`, `GUEST_READY_MARKER`): the rootfs build
# writes the guest's init line from the same definition the driver dials, so they cannot drift.
bsx-channel = { path = "../crates/channel" }
# The scratch-dir guard for the tests, and the `/dev/kvm` probe the benches refuse a host
# with, so they and the supervisor's leak tests explain an unusable device the same way.
bsx-test-support = { path = "../crates/test-support" }

[lints]
workspace = true
