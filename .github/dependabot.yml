# Dependabot keeps the third-party GitHub Actions current. Each `uses:` names a major tag, so a
# patch lands without a commit here and this opens a weekly PR when a major moves. One grouped PR,
# so a routine bump is a single review rather than one per action.
#
# Actions only, on purpose: the Rust dependency lock is hand-pinned and mirrored offline (the
# vendored mirror plus audit.yml's daily RustSec check), so Cargo bumps stay a manual, reviewed
# step, never an automated PR. Nothing here lands without a human merge either; Dependabot only
# proposes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
