# CI: the host-safe gate, one definition. Every job runs `cargo xtask ci`, the same command a dev
# box runs, so this workflow cannot drift from the local gate: hand-mirroring the steps here is
# what lets a gate step go missing. x86_64 only, since the supported platform is x86_64 and
# aarch64 support (with its matrix leg here) needs hardware to test the privileged path on.
# The privileged tests (booting a microVM, loading/attaching eBPF) need /dev/kvm + elevated caps
# and run under `cargo xtask ci-privileged` in ci-privileged-hosted.yml (nightly, nested KVM),
# never gating the everyday loop. Scheduled companions: audit.yml (advisories vs the pinned lock,
# daily) and fuzz.yml (the deep libFuzzer tier, nightly).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: gate (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Everything `cargo xtask ci` needs, so none of its layers soft-skip here: stable
      # fmt/clippy, and the probes' pinned nightly + rust-src (`build-std` for bpfel-unknown-none).
      #
      # The nightly also carries rustfmt and clippy, because the gate lints the detached workspaces
      # under the toolchain each one pins, and `--profile minimal` includes neither. Without them
      # that layer skips, which on this job means a green run that linted the one crate allowed
      # `unsafe` not at all: the state this step's first line exists to prevent.
      - name: Install the toolchains
        run: |
          rustup component add rustfmt clippy
          rustup toolchain install nightly-2026-07-20 --profile minimal \
            --component rust-src --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # The probes are their own workspace (own toolchain, own target dir); cache both.
          workspaces: |
            .
            crates/probes

      # Prebuilt binary, so the gate's `cargo deny check` layer has its tool.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-deny

      # No prebuilt binaries published; compiled once per cache key, then served from the
      # cached ~/.cargo/bin. Version-pinned to match crates/probes/rust-toolchain.toml's nightly.
      - name: Install bpf-linker
        run: cargo install bpf-linker --locked --version 0.10.3

      - name: Run the gate
        run: cargo xtask ci

  # Workflow linting. The one job that does not delegate to `cargo xtask ci`: actionlint is a Go
  # binary that only inspects files CI runs, so requiring it on every dev box would be the wrong trade.
  lint-workflows:
    name: lint workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # actionlint is a Go binary that install-action's tool list does not carry, so this uses
      # upstream's documented CI install (their download script drops the binary in the cwd).
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: actionlint
        run: ./actionlint -color

  # Shell linting, same trade as actionlint above: a tool that only inspects the few tracked *.sh
  # files, so requiring it on every dev box would be the wrong ask. `install.sh` is the reason this job
  # exists. It ships inside the release tarball and is the documented install path, so it runs on a
  # stranger's machine with whatever shell that machine has, and until 2026-08-02 nothing checked
  # it at all. `ubuntu-24.04` carries shellcheck, so there is nothing to install.
  lint-shell:
    name: lint shell (shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tracked set, from git rather than a glob, so a new script is covered the day it lands
      # instead of the day someone remembers to extend a list here.
      # Default severity, deliberately. `--severity=warning` looks tempting, since the only findings
      # on this tree are style-tier, but it also discards SC2086 (unquoted expansion, so word
      # splitting and globbing), which is the single rule most worth having on a script that runs on
      # a stranger's machine. Verified: an unquoted `[ $VAR = x ]` is invisible at `warning` and
      # caught at the default. The intentional idioms carry a `# shellcheck disable=` at their own
      # line with the reason, which keeps the exemption next to the code it excuses.
      - name: shellcheck
        run: |
          shellcheck --version
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'checking %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  # The single check to require in branch protection. Green only if every job above succeeded or
  # was skipped: add a job above and it's covered here automatically, no branch-rule edit needed.
  ci-status:
    name: CI status
    if: always()
    needs: [gate, lint-workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job passed
        run: jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< '${{ toJson(needs) }}'
