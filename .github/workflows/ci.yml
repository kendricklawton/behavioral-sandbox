# CI: the host-safe gate, one definition. Every job runs `cargo xtask ci`, the same command a dev
# box runs, so this workflow cannot drift from the local gate: hand-mirroring the steps here is
# what lets a gate step go missing. Matrix targets: Linux x86_64 (ubuntu-24.04) and macOS aarch64
# (macos-14 Apple Silicon). Scheduled companions: audit.yml (daily) and fuzz.yml (nightly).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: gate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Install libkrun on macOS so the libkrun wrapper and supervisor compile and test against it.
      - name: Install libkrun dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew tap slp/krun
          brew install libkrun libkrunfw
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      # Everything `cargo xtask ci` needs, so none of its layers soft-skip here. The gate lints
      # the detached `fuzz` workspace too, which builds on this same toolchain.
      - name: Install the toolchain components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary, so the gate's `cargo deny check` layer has its tool.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.4
        with:
          tool: cargo-deny

      - name: Run the gate
        run: cargo xtask ci

  # Workflow linting. The one job that does not delegate to `cargo xtask ci`: actionlint is a Go
  # binary that only inspects files CI runs, so requiring it on every dev box would be the wrong trade.
  lint-workflows:
    name: lint workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # actionlint is a Go binary that install-action's tool list does not carry, so this uses
      # upstream's documented CI install (their download script drops the binary in the cwd).
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: actionlint
        run: ./actionlint -color

  # The single check to require in branch protection. Green only if every job above succeeded or
  # was skipped: add a job above and it's covered here automatically, no branch-rule edit needed.
  ci-status:
    name: CI status
    if: always()
    needs: [gate, lint-workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job passed
        run: jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< '${{ toJson(needs) }}'
