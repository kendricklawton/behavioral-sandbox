# Release packaging: on a pushed v* tag (the user's act; tags are human-cut per RELEASES.md),
# assemble `cargo xtask dist`, sign SHA256SUMS with the EKVM_RELEASE_SIGNING_KEY secret (a
# detached ed25519 signature; a tag build without the secret or the .sig hard-fails, never ships
# unsigned), and attach tarball + SHA256SUMS + SHA256SUMS.sig to a DRAFT GitHub release, so
# publishing stays a human step too. Manual dispatch builds the package without a release, a dry
# run of the assembly, unsigned (the secret is never exposed to non-tag runs). Pre-rename
# releases are disposable checkpoints: no package managers, no promotion.
# SECURITY: tag + dispatch only, never a fork `pull_request` trigger.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  dist:
    name: package (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchains (nightly + rust-src + bpf-linker for the eBPF object; musl for the guest agent)
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add x86_64-unknown-linux-musl
          cargo install bpf-linker --locked

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .
            crates/probes

      # Tag builds sign; dispatch dry-runs stay unsigned (they publish nothing, so the secret is
      # never exposed to them). An unconfigured secret expands to "", which must be a hard fail
      # here, not a confusing key-parse error later.
      - name: Stage the release signing key (tags only)
        if: github.ref_type == 'tag'
        env:
          SIGNING_KEY: ${{ secrets.EKVM_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::EKVM_RELEASE_SIGNING_KEY secret is not configured; refusing an unsigned release" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release-signing.key"
          echo "EKVM_RELEASE_SIGNING_KEY=$RUNNER_TEMP/release-signing.key" >> "$GITHUB_ENV"

      - name: Assemble the package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            cargo xtask dist --version "${GITHUB_REF_NAME#v}"
          else
            cargo xtask dist
          fi
          ls -l dist/

      - name: Attach to a draft release (tags only; publishing stays human)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A mis-wired secret or a signing regression must not ship unsigned artifacts.
          if ! test -s dist/SHA256SUMS.sig; then
            echo "::error::dist/SHA256SUMS.sig is missing or empty; refusing to release unsigned artifacts" >&2
            exit 1
          fi
          # release-key.pem rides along as a convenience for manual verifiers; the trust anchor
          # is the copy pinned in the repo (and in install.sh), not the asset next to the tarball.
          gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" \
            --notes "Pre-release checkpoint. Verify: openssl pkeyutl -verify -pubin -inkey release-key.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig (against the repo-pinned release-key.pem), then sha256sum -c SHA256SUMS. Install: see install.sh." \
            dist/ekvm-*-x86_64-linux.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig release-key.pem
