# The guest userland is the other upstream nothing in this repo watches. `cargo deny` and
# audit.yml's RustSec sweep read `Cargo.lock`, and the Alpine packages baked into the guest image
# are not in it. The install floats within one Alpine branch deliberately (branch repos carry only
# the latest revision per package, so an exact `pkg=ver-rN` pin would *fail* the build the day
# upstream bumps, not reproduce it, see `GUEST_PACKAGES` in `xtask/src/rootfs.rs`), and
# `xtask/rootfs-packages.lock` records what the last build actually resolved.
#
# This job is the only enforcer. Every `build-rootfs` mode *reports* closure drift and none fails on
# it, because the build resolves fresh from the branch either way: refusing there costs a caller
# their image without producing a reviewed one. This job fails instead, and did, on 2026-07-30
# (nodejs 24.17.0-r0 -> 24.18.1-r0) and again on 2026-08-15 (python3 3.14.5-r0 -> 3.14.7-r0, plus
# `expat` entering the closure). Weekly, rebuild and diff the lockfile, so the bump arrives as a
# scheduled notification instead of an ambush.
#
# Failing rather than opening a PR: the lockfile is a record of the image this project ships, so
# re-pinning is a human deciding to ship a new guest userland. What moved matters (a runtime
# security fix reads differently from a patch bump), and a guest should boot against the new image
# before it goes anywhere.
#
# Unprivileged on purpose: `apk.static` installs a closure into `--root` without root and without
# running maintainer scripts, so this needs no KVM box and no root.
name: rootfs-packages

on:
  schedule:
    # Wednesdays 06:45 UTC, after audit.yml's 05:30, so the two upstream watchers stay two
    # separate signals. This job fails on drift rather than opening a
    # PR, so its period is also how often a stale lockfile re-nags: a week's worst-case window is
    # the trade for one notification instead of seven.
    - cron: "45 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-is-current:
    name: guest package closure vs the Alpine branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain (musl, for the static guest agent baked into the image)
        run: rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Rebuild the guest image and re-pin the closure
        # `--update-lock` rewrites the lockfile from what this build resolved; the diff below is
        # then the answer. Asking the build to *check* instead would only reprint the warning the
        # gate already prints, without naming which package moved.
        run: |
          cargo xtask build-rootfs --update-lock
          cargo xtask build-rootfs --desktop --update-lock

      - name: Did the closure move?
        run: |
          set -euo pipefail

          if git diff --quiet -- xtask/rootfs-packages.lock xtask/rootfs-desktop-packages.lock; then
            echo "Both image closures still match their lockfiles."
            exit 0
          fi

          echo "A resolved closure differs from its committed lockfile:"
          echo ""
          git --no-pager diff -- xtask/rootfs-packages.lock xtask/rootfs-desktop-packages.lock
          echo ""
          echo "::error::Alpine moved a package in the guest image's closure."
          echo ""
          echo "Re-pinning is a human step, not a bot PR. It means:"
          echo "  1. read the diff above: which package moved, and is it a security fix?"
          echo "  2. run 'cargo xtask build-rootfs --update-lock' (and '--desktop --update-lock') locally and commit the lockfile"
          echo "  3. boot a guest against the rebuilt image before trusting it"
          exit 1
