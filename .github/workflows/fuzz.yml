# The deep fuzzing tier: coverage-guided libFuzzer over the
# untrusted-input decoders, the host↔guest channel (guest-controlled bytes) and the signed-record
# envelope (attacker-relayed by design: a verifier checks a record without trusting the host that
# delivered it). The CI gate runs the cheap dependency-free property tests on every push; this
# runs the real fuzzer nightly, a bounded 15 minutes per target, through the same `cargo xtask
# fuzz` a dev box uses. A
# crash fails the run and uploads the reproducing input from fuzz/artifacts/; feed the minimized
# reproducer back as a `crates/channel` unit test when fixing it.
name: fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libfuzzer:
    name: fuzz ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Ordered by value: protocol_message is the daemon's outermost boundary (any client's bytes
        # off bsx serve's socket); channel_response is the host reading guest-controlled bytes;
        # signing_envelope is the verifier reading a record relayed by an untrusted host. syscall_event
        # is defense-in-depth (the record is kernel-written; the tap frame is guest-crafted).
        target: [protocol_message, channel_response, signing_envelope, channel_request, channel_frame, channel_handshake, syscall_event, egress_rule, audit_record, bsx_config, output_image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pinned nightly, matching crates/probes/rust-toolchain.toml: `cargo xtask fuzz` selects
      # it explicitly (`cargo +nightly-<date> fuzz`), so installing the floating alias here would
      # leave the run with no toolchain at all. One nightly serves the whole repo.
      - name: Install the pinned nightly toolchain
        run: rustup toolchain install nightly-2026-07-20 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          # The fuzz harness is its own workspace; cache it alongside the root (for xtask).
          workspaces: |
            .
            fuzz

      # No prebuilt binary; compiled once per cache key, then served from the cached ~/.cargo/bin.
      # Version-pinned: `--locked` locks cargo-fuzz's dependencies, not cargo-fuzz, so without it a
      # crash found here may not reproduce on a dev box running a different fuzzer.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The inputs libFuzzer keeps, carried night to night: 15 minutes from cold re-derives what
      # last night already found, and accumulation is where coverage-guided fuzzing reaches past the
      # shallow decode paths the in-gate property tests already cover.
      #
      # Keyed and scoped **per target**, so eleven concurrent jobs never write one entry (each holds
      # only its own corpus, and none can clobber another's). The name comes from `matrix.target`,
      # which `fuzz_targets_are_single_sourced` already holds to `FUZZ_TARGETS`, so this adds no
      # second copy of the list. The key is unique per run because a cache entry is immutable; a
      # stable key would restore and then decline to save.
      - name: Restore the fuzzing corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz for 15 minutes
        run: cargo xtask fuzz ${{ matrix.target }} --seconds 900

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
