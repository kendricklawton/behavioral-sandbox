# The per-change fuzz smoke: a short bounded run of *every* libFuzzer
# target, so a change that breaks a decoder is caught before it lands, not only on the nightly deep
# run (.github/workflows/fuzz.yml). This is the coverage-guided complement to the in-gate
# dependency-light property tests: those run on the host-safe `ci` gate every push; this runs the
# real fuzzer briefly, seeded, per change. A crash fails the job and uploads the reproducing input
# from fuzz/artifacts/.
name: fuzz-smoke

# Scoped to what a target can actually reach, because this job is a *regression* check. The corpus
# carries between runs (see the cache step below), so each run extends the last one's search instead
# of re-deriving it from the seeds, which is what makes a 60s budget worth spending per change. The
# crates below are the ones the targets drive; `Cargo.lock` is here because a dependency bump can
# change decode behavior under an unchanged decoder. The gap this accepts: a change elsewhere that
# alters how a fuzzed decoder is *called* goes unsmoked until the nightly run.
on:
  pull_request:
    paths: &fuzz_inputs
      - 'crates/channel/**'
      - 'crates/cli/**'
      - 'crates/probes-loader/**'
      - 'crates/protocol/**'
      - 'crates/record/**'
      - 'crates/probes-common/**'
      - 'fuzz/**'
      - 'Cargo.lock'
      - '.github/workflows/fuzz-smoke.yml'
  push:
    branches: [main]
    paths: *fuzz_inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: fuzz smoke (all targets, 60s each)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pinned nightly, matching crates/probes/rust-toolchain.toml: `cargo xtask fuzz` selects
      # it explicitly (`cargo +nightly-<date> fuzz`), so installing the floating alias here would
      # leave the run with no toolchain at all. One nightly serves the whole repo.
      - name: Install the pinned nightly toolchain
        run: rustup toolchain install nightly-2026-07-20 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          # The fuzz harness is its own workspace; cache it alongside the root (for xtask).
          workspaces: |
            .
            fuzz

      # No prebuilt binary; compiled once per cache key, then served from the cached ~/.cargo/bin.
      # Version-pinned: `--locked` locks cargo-fuzz's dependencies, not cargo-fuzz, so without it a
      # crash found here may not reproduce on a dev box running a different fuzzer.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The inputs libFuzzer keeps, carried across runs. `fuzz/corpus/` is gitignored working data,
      # so without this every run restarts from `fuzz/seeds/` and re-walks the same ground: a
      # coverage-guided fuzzer earns its budget by accumulating, and 60s from cold buys little.
      # One entry for all targets, because this job fuzzes them in one job; the nightly matrix keys
      # per target instead, since a job there holds only its own.
      #
      # The key is unique per run because a cache entry is immutable: a stable key would restore and
      # then decline to save, so the corpus would never grow past its first write. `restore-keys`
      # takes the newest entry sharing the prefix, which makes a cold cache a seed-only run rather
      # than a failure.
      - name: Restore the fuzzing corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-smoke-${{ github.run_id }}
          restore-keys: fuzz-corpus-smoke-

      # Every target, 60s each (plus the build, well inside the 20m timeout). Seeds are folded in
      # by `fuzz-smoke`, so the short budget reaches the decode logic, not the message shape.
      - name: Fuzz smoke
        run: cargo xtask fuzz-smoke --seconds 60

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
