# Firecracker is the one dependency nothing else in this repo watches. It is not a crate: the driver
# `Command::new`s the binary and speaks HTTP to its socket, so it never enters `Cargo.lock`, which
# means `cargo deny` and audit.yml's RustSec sweep are both blind to it. It is also the component
# that provides the hardware isolation boundary, and upstream only backports security fixes to the
# last few minor series, so "our pin fell off the supported list" is a state we would otherwise
# discover by accident.
#
# This job is the notification: weekly, compare the version pinned in `doctor.rs` against upstream's
# latest release and fail if we are behind. Failing (rather than opening a PR) is deliberate: bumping
# the pin means re-verifying sha256s, re-running the privileged gate against the new binary, and
# checking the API request bodies still match, none of which a bot should propose. The red run is
# the prompt for a human to do that.
name: firecracker-pin

on:
  schedule:
    # Wednesdays 06:15 UTC, offset from audit.yml's 05:30 so a bad morning is two separate signals.
    - cron: "15 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-is-current:
    name: pinned Firecracker vs upstream latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the pinned release against upstream
        env:
          # Read-only, and only for the public releases API: the default token, not a PAT.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The pin lives in one place (doctor.rs' comment markers next to each sha256), so this
          # reads the source of truth rather than a duplicate the two could drift apart on.
          pinned="$(grep -oE '// v[0-9]+\.[0-9]+\.[0-9]+' crates/vmm/src/doctor.rs \
            | sed 's|// v||' | sort -V | tail -1)"
          if [ -z "$pinned" ]; then
            echo "::error::could not read the pinned Firecracker version from crates/vmm/src/doctor.rs"
            echo "If the pin moved, update this workflow's parser with it."
            exit 1
          fi

          latest="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/firecracker-microvm/firecracker/releases/latest \
            | grep -oE '"tag_name": *"v[^"]+"' | head -1 | sed 's|.*"v||; s|"||')"
          if [ -z "$latest" ]; then
            echo "::error::could not read the latest Firecracker release from the GitHub API"
            exit 1
          fi

          echo "pinned:  v$pinned"
          echo "latest:  v$latest"

          if [ "$pinned" = "$latest" ]; then
            echo "The pin is current."
            exit 0
          fi

          # `sort -V | tail -1` picks the newer of the two: if that is still ours, upstream has not
          # moved past us (a yanked release, or a tag we already lead).
          newer="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)"
          if [ "$newer" = "$pinned" ]; then
            echo "The pin is at or ahead of the latest tagged release."
            exit 0
          fi

          echo "::error::Firecracker v$latest is out; this repo pins v$pinned."
          echo ""
          echo "Bumping the pin is a human step, not a bot PR. It means:"
          echo "  1. read the release notes for API and snapshot-format changes"
          echo "  2. sha256 the new release binary and update PINNED_FIRECRACKER_SHA256"
          echo "     in crates/vmm/src/doctor.rs (keep the older sha until the floor moves)"
          echo "  3. run 'cargo xtask ci-privileged' against the new binary"
          echo "  4. check whether v$pinned is still in upstream's supported series"
          exit 1

      # The second, sharper question. The one above asks "are we behind?"; this asks "are we still
      # claiming to support a release nobody patches?" A floor that quietly outlives upstream's
      # support window is how this repo ends up blessing an unpatched isolation boundary again,
      # and no amount of reading release notes surfaces it, because nothing changes here when a
      # series *ages out* upstream.
      - name: Is our supported floor still supported upstream?
        run: |
          set -euo pipefail

          floor="$(grep -oE 'MIN_SUPPORTED_FC_VERSION: \(u64, u64\) = \([0-9]+, [0-9]+\)' \
            crates/vmm/src/spawn.rs | grep -oE '\([0-9]+, [0-9]+\)$' | tr -d '() ' | tr ',' '.')"
          if [ -z "$floor" ]; then
            echo "::error::could not read MIN_SUPPORTED_FC_VERSION from crates/vmm/src/spawn.rs"
            echo "If the constant moved or was renamed, update this workflow's parser with it."
            exit 1
          fi

          # Upstream's release-status table is the authority: rows whose last column is literally
          # "Supported" are the series still receiving patches. Parsing their doc rather than
          # re-deriving their policy means we track what they actually do, not our reading of it.
          policy="$(curl -fsSL https://raw.githubusercontent.com/firecracker-microvm/firecracker/main/docs/RELEASE_POLICY.md)"
          oldest="$(printf '%s\n' "$policy" \
            | grep -E '^\| *v[0-9]+\.[0-9]+ .*\| *Supported *\|?$' \
            | grep -oE 'v[0-9]+\.[0-9]+' | sed 's|^v||' | sort -V | head -1)"
          if [ -z "$oldest" ]; then
            echo "::error::could not parse the Supported rows out of upstream's RELEASE_POLICY.md"
            echo "Their table format likely changed; update this workflow's parser."
            exit 1
          fi

          echo "our floor:            v$floor"
          echo "oldest supported:     v$oldest"

          if [ "$floor" = "$oldest" ]; then
            echo "The floor matches upstream's oldest supported series."
            exit 0
          fi

          newer="$(printf '%s\n%s\n' "$floor" "$oldest" | sort -V | tail -1)"
          if [ "$newer" = "$floor" ]; then
            echo "::error::our floor (v$floor) is ABOVE upstream's oldest supported series (v$oldest)."
            echo "We are refusing a release the Firecracker team still patches, which pushes"
            echo "operators onto an older unpatched VMM to satisfy us. Lower"
            echo "MIN_SUPPORTED_FC_VERSION in crates/vmm/src/spawn.rs to v$oldest, and check"
            echo "whether any conditional API field (e.g. clock_realtime) needs a new gate."
            exit 1
          fi

          echo "::error::our floor (v$floor) is BELOW upstream's oldest supported series (v$oldest)."
          echo "v$floor no longer receives security patches, so we are blessing an unpatched"
          echo "isolation boundary. Raise MIN_SUPPORTED_FC_VERSION in crates/vmm/src/spawn.rs to"
          echo "v$oldest, drop any now-dead version gate, and update the host-requirements line."
          exit 1
