name: Bug report
description: Something the engine does wrong: a boot, exec, snapshot, probe, or audit-record misbehavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the report. One check first: if this is a **suspected vulnerability** (an
        isolation escape, a way to tamper with the audit log, a host-path panic from guest input),
        please use the private
        [security-advisory form](https://github.com/kendricklawton/behavioral-sandbox/security/advisories/new)
        instead of a public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: The observed behavior vs the expected one. Exact error text beats a paraphrase.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: >-
        The exact command line, plus anything it needs to trigger. The smaller the repro, the faster
        the fix. Note that nothing in this tree boots a sandbox today: the engine was deleted in the
        move to libkrun and its replacement is not written.
      placeholder: |
        cargo xtask build-rootfs
      render: shell
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: "`cargo xtask setup` output"
      description: >-
        Paste the full output: it captures the hypervisor and the dev toolchain in one shot, which
        answers most environment questions up front.
      render: text
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host kernel and architecture
      description: "`uname -srm` (e.g. `Linux 6.12.1-arch1 x86_64`)."
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - CLI, jailed (the default)
        - CLI, --unjailed
        - embedded (the `bsx` library API)
      multiple: true
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        stderr (the `tracing` output) and, if relevant, the run's JSON result/audit record from
        stdout. Trim to the interesting window if it's long.
      render: text
    validations:
      required: false
