name: Feature request
description: Something the engine should do that it doesn't.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        One scope note before you write: this repo is **an engine, not a platform**. The platform
        layer above it is deliberately out of scope and belongs to whatever hosts the engine; the
        non-goals are listed in `docs/embedding-scope.md`. Requests inside that line are very
        welcome.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you trying to do that the engine can't (or makes harder than it should be)?
        Describe the use case, not just the missing knob: sometimes there's a better shape for it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape (optional)
      description: >-
        If you have a concrete API/CLI/wire shape in mind, sketch it. If it touches the pinned
        public API (`Sandbox`, `Limits`, `RunResult`, `VmmError`, the `bsx-channel` wire protocol) or the
        audit-record format, say so, since those change deliberately.
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Which surface does it touch?
      options:
        - CLI (bsx run / shell / doctor)
        - engine API (the `bsx` library)
        - probes / audit record
        - benchmarks / docs / tooling
        - not sure
      multiple: true
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: >-
            This is engine work, not a platform feature (those belong to the hoster, out of scope
            by design: see `docs/embedding-scope.md`).
          required: true
