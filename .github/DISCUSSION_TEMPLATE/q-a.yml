body:
  - type: markdown
    attributes:
      value: |
        **Do not report security issues here.** If you think you have found a sandbox escape, or
        anything that weakens the isolation or the audit record, report it privately through
        [GitHub Security Advisories](https://github.com/kendricklawton/behavioral-sandbox/security/advisories/new).
        See [`SECURITY.md`](https://github.com/kendricklawton/behavioral-sandbox/blob/main/SECURITY.md).

        Most first-run failures are already answered in the pinned **Common first failures** post
        and in the [troubleshooting
        table](https://github.com/kendricklawton/behavioral-sandbox/blob/main/docs/cli-install.md#troubleshooting).
        Worth a look before you write this up.

  - type: textarea
    id: what-happened
    attributes:
      label: What you ran, and what happened
      description: The exact command, and the full stderr. Paste it whole rather than the line you think matters.
      render: console
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: "`cargo xtask setup` output"
      description: >
        All of it. BSX probes host capabilities rather than distributions, so these rows
        usually identify the problem outright.
      render: console
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Host kernel
      description: "`uname -r`"
      placeholder: 6.8.0-generic
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part
      options:
        - Building from source
        - The guest image build (cargo xtask build-rootfs)
        - The host↔guest wire (bsx-channel) or the in-guest agent
        - Where the rebuild is going
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before posting
      options:
        - label: This is not a security report.
          required: true
        - label: >
            I understand BSX is pre-release and unaudited, with one maintainer, and that a reply
            may take a few days.
          required: true
