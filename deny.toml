# cargo-deny config: the supply-chain gate (`cargo deny check`, run by CI and `cargo xtask ci`).
# Keep the dependency tree light, license-clean, and advisory-free. See https://embarkstudios.github.io/cargo-deny/

# The two targets this project builds for (AGENTS.md). Without this every crate in the lockfile
# is audited, including the Android, wasm and Windows halves of `winit` that nothing here compiles.
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
# Fail on any known RustSec advisory in the tree. `yanked` crates are also rejected.
version = 2
yanked = "deny"
# Each exception names the crate, who pulls it in, and why the tree carries it anyway; a new
# advisory outside this list fails the gate.
ignore = [
    # `paste`, a proc macro under `metal`, the macOS half of wgpu. Unmaintained, not vulnerable, and
    # a macro that runs at compile time on this tree's own source.
    { id = "RUSTSEC-2024-0436", reason = "paste: compile-time macro under metal (wgpu on macOS)" },
    # `ttf-parser`, the font parser under `cosmic-text`, which draws iced's text. Unmaintained; the
    # fonts it parses are the host's own, not a guest's.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: host font parsing under cosmic-text (iced)" },
]

[licenses]
version = 2
# Minimal permissive set: only the licenses actually present in the tree today, so `cargo deny`
# runs warning-clean. Add to this list deliberately (with a reason) when a new dependency needs
# it: a missing license fails the CI gate and names the offending crate.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # `foldhash` is Zlib-licensed: OSI-approved and FSF-free/permissive.
    "Zlib",
    # BSD-3-Clause: OSI-approved and FSF-free/permissive.
    "BSD-3-Clause",
    # `libloading`, which `winit` opens the display server's libraries through (`*-dlopen`).
    "ISC",
    # `arrayref`, under `tiny-skia`, which draws the Wayland window decorations.
    "BSD-2-Clause",
    # `hexf-parse`, the hex-float parser under `naga`, wgpu's shader compiler. A public-domain
    # dedication, with a permissive fallback licence where that is not recognised.
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Flag multiple versions of the same crate (bloat / drift); tighten to "deny" once the tree is stable.
multiple-versions = "warn"
# No `*` version requirements on crates.io deps. The workspace's internal `{ path = ... }` crates carry no
# version and would otherwise trip this, so path deps are explicitly allowed.
wildcards = "deny"
allow-wildcard-paths = true
# Decision 7 (synchronous engine, no async runtime) was prose with nothing behind it: the tree
# happened to be clean, and a transitive dependency could have pulled a runtime in without anything
# saying so. An async runtime arriving is a design change, so it should fail the gate and be argued
# for, not land as a lockfile diff nobody reads.
deny = [
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
    { name = "async-executor" },
]

[sources]
# Only the official crates.io registry: no unknown git or alternate registries.
unknown-registry = "deny"
unknown-git = "deny"
