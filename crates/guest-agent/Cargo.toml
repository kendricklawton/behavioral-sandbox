[package]
name = "bsx-guest-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The in-guest agent: runs one command per connection and streams its output over the channel."

# The bin name stays `guest-agent` while the package is `bsx-guest-agent`: it is the path the
# rootfs build bakes into the guest image (`GUEST_AGENT_PATH` in `xtask/src/rootfs.rs`).
[[bin]]
name = "guest-agent"
path = "src/main.rs"

[dependencies]
# The wire protocol is shared with the host driver; tracing is the guest agent's stderr log.
# `serve` is transport-agnostic (any `Read`+`Write`); `main` binds the concrete listener.
bsx-channel = { path = "../channel" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The in-VM transport: a static `AF_VSOCK` listener. Guest-agent-only: the host reaches libkrun's
# vsock over a plain `UnixStream`, not `AF_VSOCK`. The crate's internal `unsafe` is the dep's, not
# ours (this crate stays `#![forbid(unsafe_code)]`). Pinned; all of its tree is MIT/Apache.
vsock = "0.5.4"
# The pty half of the interactive shell: allocate the pair, set the winsize, kill an orphaned
# session. Safe wrappers only; this crate stays `#![forbid(unsafe_code)]`.
rustix = { workspace = true, features = ["pty", "termios", "process", "mount"] }

# The shared scratch-dir guard, so the `PATH`-resolution tests stage a real executable without a
# hand-rolled temp dir. A dev-dep, so the static musl binary baked into the rootfs is unaffected.
[dev-dependencies]
bsx-test-support = { path = "../test-support", features = ["tracing-capture"] }

[lints]
workspace = true
