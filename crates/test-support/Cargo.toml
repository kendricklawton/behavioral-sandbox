[package]
name = "bsx-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
description = "Test-only helpers shared across crates (cgroup caps, host-capability probes, the fuzz generator). Never shipped."

# No dependencies by design: pure-std helpers (`/proc`, `/sys`, `std::fs`), so this stays a leaf both
# the driver and the loader test suites can borrow without coupling to either. The one exception is
# **optional and off by default**, so a crate that borrows only the pure-std half still sees an empty
# dependency list: `tracing-capture` carries the log-capturing sink the suites that assert on what a
# log line *says* need. Both crates that enable it already depend on these two directly, so it adds
# no crate to any tree.
[dependencies]
# The `#[repr(C)]` probe records, so the synthetic-event fixture below builds the same struct the
# kernel would have written. Zero-dependency and `no_std`, so it costs a test binary nothing.
bsx-probes-common = { path = "../probes-common" }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
tracing-capture = ["dep:tracing", "dep:tracing-subscriber"]

[lints]
workspace = true
