[package]
name = "bsx-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The agent wire protocol: the versioned newline-JSON contract the daemon and its clients share."

# Deliberately a leaf: serde only, **no `bsx`**. The wire is the contract, not shared Rust
# internals, so a non-Rust client reimplements these JSON shapes without linking the engine. The one
# adversarial concern is design rule 5 (bounded, typed decode), which is pure std.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Off by default. Exposes the internal line reader + schema-gated decoder (module `fuzz`) so the
# `cargo fuzz` target in `fuzz/` can drive the daemon's untrusted-client parse path directly; never
# enabled in the normal build.
[features]
fuzzing = []

[lints]
workspace = true
