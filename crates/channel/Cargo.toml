[package]
name = "bsx-channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The host↔guest wire protocol for the sandbox exec channel (docs/architecture.md)."

# Near dependency-free by design: the protocol is hand-rolled over `std::io::{Read, Write}` so it
# stays tiny and transport-agnostic (vsock in the guest, a unix socket in tests), and both the host
# driver and the guest agent can depend on it without pulling a serialization stack into a static
# binary. The one exception is `zeroize`: a `no_std`, zero-transitive-dep crate whose `Zeroizing`
# wipes a secret-bearing payload on every scope exit, the return and the unwind alike (see
# `write_exec`/`write_put_file`), with a volatile store the optimizer cannot elide where a `fill(0)`
# is dead-store-eligible. It keeps the host path `unsafe`-free: the volatile write lives inside the
# audited crate, not in ours.
[dependencies]
zeroize = { workspace = true }

# The deterministic generator the in-gate fuzz tests drive the decoders with, shared rather than
# copied. A dev-dep, so the shipped dependency list stays the single `zeroize` entry above, and a
# workspace leaf with an empty `[dependencies]`, so it pulls nothing into the supply-chain gate.
[dev-dependencies]
bsx-test-support = { path = "../test-support" }

# Off by default. Exposes the internal wire decoders (module `fuzz`) so the `cargo fuzz` targets in
# `fuzz/` can drive them; never enabled in the normal build, so the crate's dependency list stays
# the single `zeroize` entry above and the wire contract is unchanged.
[features]
fuzzing = []

[lints]
workspace = true
