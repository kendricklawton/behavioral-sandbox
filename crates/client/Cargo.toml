[package]
name = "bsx-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The reference Rust client for the bsx wire API: drives a sandbox session over a unix socket using only the wire contract, no engine internals."

# The whole point of the reference client is to **prove a non-Rust caller can drive `bsx`** with
# nothing but the wire contract: it depends on `bsx-protocol` (the shared JSON shapes) and
# `serde_json` (the opaque `trace` record), and deliberately **not** on `bsx`. If this ever
# links the engine, the proof is void: reimplementing it in any language must need only a JSON
# library and a unix socket, which is exactly what this dependency set models.
[dependencies]
bsx-protocol = { path = "../protocol" }
serde_json = { workspace = true }

[lints]
workspace = true
