# The eBPF crate needs **nightly** for `-Z build-std` (rustup has no prebuilt `core` for
# `bpfel-unknown-none`), and `rust-src` to build it from source. This pins *only this crate* to
# nightly: the host workspace stays on stable (`../../rust-toolchain.toml`), which is why
# `crates/probes` is excluded from the workspace. `cargo` (the rustup proxy) reads this file when it
# runs in this directory, so `cargo xtask build-probes` gets nightly here without touching the rest.
#
# **Pinned to an exact date, for the same reason the workspace pins an exact stable.** A floating
# `channel = "nightly"` means every build takes whatever shipped that morning, so a compiler change
# breaks this crate with no commit from anyone: aya-ebpf 0.2.1 exists partly because a nightly began
# rejecting its intrinsic definitions. An exact date makes that a deliberate bump rather than a
# surprise, and makes a local build and CI run the identical compiler.
#
# **This file is the single source of the nightly pin.** `xtask` reads the channel out of it instead
# of hardcoding `nightly` (an explicit `rustup run nightly` would override this file), and the CI
# workflows install exactly this toolchain. `ebpf_toolchain_pins_are_single_sourced` fails the gate
# if any of them drift apart.
[toolchain]
channel = "nightly-2026-07-20"
components = ["rust-src"]
