[package]
name = "bsx-krun"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The safe wrapper over libkrun, and the raw declarations under it."
# Cargo's native-library uniqueness guard: two crates in one graph cannot both claim `krun`, so a
# second set of bindings entering by any route is a build error rather than a duplicate-symbol
# surprise at link time.
links = "krun"
build = "build.rs"

[dependencies]
# The fd a shared scanout lives in and the `ftruncate` that sizes it (`fs`), the mapping of it
# (`mm`), and `event` for the poll both platforms use plus the eventfd only Linux has.
rustix = { workspace = true, features = ["event", "fs", "mm"] }

# macOS has neither Linux primitive: `shm` backs the shared scanout and `pipe` the readiness fd.
# `crates/krun/src/platform.rs` says why each stands in for what.
[target.'cfg(target_os = "macos")'.dependencies]
rustix = { workspace = true, features = ["shm", "pipe"] }

[lints]
workspace = true
