[package]
name = "ekvm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The eKVM CLI (`ekvm`): drive the Firecracker + aya code-execution sandbox."

# One entrypoint: `ekvm`, the canonical command, built from `src/main.rs`. The driver
# daemon is the `ekvm serve` subcommand (`src/serve.rs`, with its `session`/`metrics`
# modules), not a separate binary.
[[bin]]
name = "ekvm"
path = "src/main.rs"

[dependencies]
# The audit face (`--trace`/`--record`/`--watch`): the CLI is the caller that composes the two
# tracks: it bridges `Sandbox`'s plain values (pid/netns/tap) into the probes' attach bundle.
probes-loader = { path = "../probes-loader" }
vmm = { path = "../vmm" }
# The `ekvm` daemon's wire protocol: the versioned newline-JSON contract it shares with the
# reference client and the polyglot SDKs. A serde-only leaf, no engine internals.
protocol = { path = "../protocol" }
clap = { workspace = true }
# `ekvm run --watch`: the live TUI, drawn on stderr (stdout stays the run's result).
ratatui = { workspace = true }
# `.ekvm.toml` config file layer (`flags > env > file > defaults`): serde-derived, unknown keys
# denied so a config typo is a typed error, not a silent no-op.
serde = { workspace = true }
# `ekvm run --json`: the structured run result is one JSON object on stdout.
serde_json = { workspace = true }
# `ekvm`'s SIGTERM/SIGINT handler (log, unlink the socket, exit cleanly for a supervisor).
# Already in the dependency tree transitively (crossterm), so no new crate enters the tree.
# A **non-destructive** readability check on the session socket, so the daemon can notice a
# `cancel` (or a hang-up) while an exec is in flight. `UnixStream::peek` is still unstable, and
# nix's `recv(MSG_PEEK)` is a *safe* function, so the CLI needs no `unsafe` (the same reasoning
# that put nix in `vmm` for a bounded connect and `probes-loader` for `setns`). Already in the
# tree via `vmm`, so no new crate enters it.
nix = { version = "0.31", default-features = false, features = ["socket"] }
signal-hook = "0.3"
toml = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The reference client for the versioned wire API (docs/daemon.md), used by the
# daemon's e2e demo to prove a caller drives `ekvm` over the wire alone. A dev-dep so the daemon
# crate can spawn `ekvm` (it owns the artifacts)
# while the client itself stays free of `vmm`.
client = { path = "../client" }
# The shared scratch-dir guard for the unit tests and the trace e2e (one copy, not four).
test-support = { path = "../test-support" }

[lints]
workspace = true
