[package]
name = "bsx-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "The Firecracker driver: microVM lifecycle, networking, snapshots, and the Sandbox API."

[dependencies]
# The Firecracker API is JSON over a unix socket: serde builds the request bodies, serde_json
# (de)serializes, and a tiny hand-rolled HTTP/1.1 client over `std::os::unix::net::UnixStream`
# speaks to it: no async runtime, no HTTP crate. The host path stays `unsafe`-free.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
# The bulk-output readback. The alternative is shelling out to `e2fsck` + `debugfs rdump`, which
# parses a wholly guest-authored filesystem in C with the driver's privileges; this parses it in
# `unsafe`-free Rust in-process, so the readback needs no host tool, no child process, and no
# privilege drop around one.
ext4-view = { workspace = true }
# The host↔guest exec channel: the driver speaks the shared protocol over Firecracker's vsock.
bsx-channel = { path = "../channel" }
# A **deadline-bounded** unix-socket connect. `std` offers only a blocking `UnixStream::connect`, so
# bounding it without this means a detached thread per dial, never joined and stuck forever while the
# peer's backlog stays full: a thread and fd leak on a wedged VMM. A non-blocking socket plus a retry
# loop needs no thread, and nix's socket calls are *safe* functions, so the driver stays
# `#![forbid(unsafe_code)]` (the same reasoning that put nix in `bsx-probes-loader` for `setns`).
# Pinned to the 0.31 the workspace already carries so the build links one copy.
nix = { version = "0.31", default-features = false, features = ["socket"] }

[features]
# Exposes the output-image geometry bound to `cargo xtask fuzz output_image`, so the target checks
# the same thing the readback does instead of carrying its own copy that could drift from it.
fuzzing = []

[dev-dependencies]
# The round-trip channel test runs the real guest agent behind a fake vsock socket, no VM needed.
bsx-guest-agent = { path = "../guest-agent" }
# The secret-hygiene leak test captures everything both sides log during an exec and greps it.
tracing-subscriber = { workspace = true }
# Cross-crate test helpers (the cgroup-cap harness, host-capability probes), shared with the loader's
# privileged tests so they aren't copy-pasted. Dev-only, never shipped.
bsx-test-support = { path = "../test-support" }

[lints]
workspace = true
