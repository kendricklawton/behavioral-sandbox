[book]
authors = ["PackSixFour LLC"]
src = "."
title = "eKVM"


[output.html]
git-repository-url = "https://github.com/packsixfour/ekvm"
edit-url-template = "https://github.com/packsixfour/ekvm/edit/main/docs/{path}"
# Only affects 404.html, which gets `<base href>` from this so its relative
# asset and nav links resolve from any subdirectory. A path, not an absolute
# URL: the site serves at the apex (docs/CNAME pins the domain), so "/" is
# correct without baking the domain into the generated page.
site-url = "/"

