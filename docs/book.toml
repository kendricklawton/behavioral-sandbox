[book]
authors = ["Kendrick Lawton"]
src = "."
title = "bsx"


[output.html]
git-repository-url = "https://github.com/kendricklawton/behavioral-sandbox"
edit-url-template = "https://github.com/kendricklawton/behavioral-sandbox/edit/main/docs/{path}"
# Only affects 404.html, which gets `<base href>` from this so its relative
# asset and nav links resolve from any subdirectory. A path, not an absolute
# URL, so the generated page carries no hostname: this is a GitHub Pages
# *project* site, so the path is the repository name. A site served at the
# apex of a domain would use "/" instead.
site-url = "/behavioral-sandbox/"

